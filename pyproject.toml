[project]
name = "sentinelforge"
version = "0.1.0"
description = "Privacy-first AI developer platform with MCP, local RAG, and sandboxed code generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "numpy>=2.2,<3",
  "sentence-transformers>=5,<6",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "python-json-logger>=3,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

docker = false
